<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Forest of Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#2f3a17;--leaf:#5c6b2b;--cream:#f7f4e9;--ink:#2f3419;--muted:#7a7c58;
  --night-bar:#141b0b;--night-border:#3a4020;--night-text:#ece8d4;--night-soft:#c6c7aa;
  --gold:#c9b87f;--gold-ink:#1a1c0a;
  --grad-card:linear-gradient(150deg,#212b11 0%,#141b0b 100%);
  --grad-gold:linear-gradient(135deg,#e6d9a6 0%,#c9b87f 55%,#aa976c 100%);
  --grad-moss:linear-gradient(135deg,#2c3016 0%,#4a5a26 100%);
  --serif:'Cormorant Garamond','Playfair Display',Georgia,serif;
  --ui:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:0 16px 40px;min-height:100vh;background:linear-gradient(180deg,#f7f4e9 0%,#ecead2 100%) fixed;color:var(--ink);font:14px/1.5 var(--ui);max-width:680px;margin-inline:auto}
header{margin:0 -16px 22px;padding:34px 20px 30px;text-align:center;background:var(--grad-moss);color:var(--night-text);border-radius:0 0 26px 26px;box-shadow:0 10px 30px #0003}
header .brand{font:italic 600 34px/1.1 var(--serif);letter-spacing:-.02em;margin:0}
header p{margin:8px 0 0;font-size:13px;color:var(--night-soft)}
.box{background:var(--grad-card);border:1px solid var(--night-border);border-radius:14px;padding:18px 18px 16px;margin-bottom:16px;color:var(--night-text);box-shadow:0 8px 25px #0003}
.box b{display:block;font:italic 600 22px/1.2 var(--serif);letter-spacing:-.02em;margin-bottom:6px}
.box small{color:var(--night-soft);font-size:12px}
input,textarea,select,button{width:100%;font:inherit;font-size:14px;margin:7px 0}
input,textarea,select{padding:12px 16px;border-radius:12px;border:1px solid #3d4422;background:linear-gradient(135deg,#1b200d,#101608);color:#f1ecd6;outline:none;box-shadow:0 3px 12px #0002}
input::placeholder,textarea::placeholder{color:#9a9b7e}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 4px #c9b87f22}
textarea{min-height:260px;resize:vertical;font-family:var(--serif);font-size:17px;line-height:1.55}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(135deg,#1b200d,#101608)}
input[type=file]{padding:10px 12px;font-size:12px;color:var(--night-soft)}
button{padding:12px 16px;border:0;border-radius:30px;background:var(--grad-gold);color:var(--gold-ink);font-weight:700;cursor:pointer;box-shadow:0 5px 16px #0004;transition:.2s}
button:hover{transform:translateY(-1px);box-shadow:0 8px 20px #0005}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.s{width:auto;margin:0;padding:6px 14px;font-size:12px;background:transparent;color:#e0a39a;border:1px solid #6b3a33;box-shadow:none}
button.s:hover{background:#6b3a3355;transform:none}
#logout{background:transparent;color:var(--muted);border:1px solid #b9b998;box-shadow:none;margin-top:4px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--night-border);color:var(--night-text)}
.row:first-child{border-top:0}
#msg,#impmsg{min-height:1.4em;font-size:13px;color:var(--gold)}
#hint{display:block;margin:2px 4px 6px}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body>
<header><h1 class="brand">Forest of Words</h1><p>Add a new poem to the collection</p></header>
<div id="login" class="box">
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn">Log in</button>
</div>
<div id="app" hidden>
  <div class="box">
    <input id="title" placeholder="Title">
    <input id="author" value="Shaina" placeholder="Author">
    <textarea id="text" placeholder="Paste the whole poem here (Enter = new line, blank line = new stanza)"></textarea>
    <select id="cat"></select>
    <small id="hint"></small>
    <button id="save">Save poem</button>
    <div id="msg"></div>
  </div>
  <div class="box"><b>Poems added from admin</b><div id="list"></div></div>
  <div class="box"><b>One-time import</b><br><small>Choose poems.json to upload all existing poems to the database.</small>
  <input id="file" type="file" accept=".json"><button id="imp">Import poems.json</button><div id="impmsg"></div></div>
  <button id="logout" style="background:#666">Log out</button>
</div>
<script>
const SUPABASE_URL='https://xbdjigqrhsptepibvmgq.supabase.co', SUPABASE_ANON_KEY='sb_publishable_1F9D8VbT7O7V6TN_Hx07gw_R0IrJIrA';
const CATS=[
  ['love','Heart',/love|heartbreak|lover|kiss|crush|miss you|goodbye|good-bye|relationship|romance|darling|belong to you|fall for|mahal|pag-ibig|pag ibig|pagmamahal|puso|sinta|iniibig|minahal|nagmahal|paglayo|paalam/i],
  ['self','Mirror',/myself|self-love|self love|my worth|who i am|my identity|own heart|choose myself|self-respect|self respect|my dreams|my fear|my mind|sarili|pagkatao|kakayahan|aking sarili/i],
  ['healing','Dawn',/healing|heal|grow|growth|letting go|let go|moving on|forgive|forgiveness|peace|stronger|survive|recovery|paghilom|pagbangon|pagsubok|pag-asa|pagasa/i],
  ['family','Belonging',/family|mother|father|parents|sister|brother|friend|friendship|best friend|pamilya|ina|ama|magulang|kaibigan|kapatid/i],
  ['faith','Grace',/god|jesus|faith|prayer|heaven|lord|church|bless|diyos|panginoon|panalangin|pananalig|biyaya/i],
  ['life','Dreams',/life|dream|future|journey|path|purpose|hope|tomorrow|begin again|destination|buhay|pangarap|paglalakbay|kinabukasan|panahon/i],
  ['other','Whispers',/.*/]
];
const $=id=>document.getElementById(id);
let token=sessionStorage.getItem('tok');
const H=()=>({apikey:SUPABASE_ANON_KEY,...(token?{Authorization:'Bearer '+token}:{}),'Content-Type':'application/json'});
const say=(t,bad)=>{$('msg').textContent=t;$('msg').style.color=bad?'#c33':'inherit'};
let touched=false;
CATS.forEach(([k,n])=>$('cat').add(new Option(n+' ('+k+')',k)));
$('cat').onchange=()=>touched=true;
function suggest(){
  if(touched)return;
  const t=($('title').value+' '+$('text').value);
  const hit=CATS.find(([k,n,re])=>k!=='other'&&re.test(t))||CATS[CATS.length-1];
  $('cat').value=hit[0];$('hint').textContent='Auto category: '+hit[1]+' (you can change it)';
}
$('title').oninput=$('text').oninput=suggest;
function show(){$('login').hidden=!!token;$('app').hidden=!token;if(token)load()}
$('loginBtn').onclick=async()=>{
  const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('pass').value})});
  const j=await r.json();
  if(!r.ok){alert(j.error_description||j.msg||'Login failed');return}
  token=j.access_token;sessionStorage.setItem('tok',token);show();
};
$('logout').onclick=()=>{sessionStorage.removeItem('tok');token=null;show()};
$('save').onclick=async()=>{
  const title=$('title').value.trim(),text=$('text').value.trim();
  if(!title||!text){say('Title and poem are required.',1);return}
  const r=await fetch(SUPABASE_URL+'/rest/v1/poems_db',{method:'POST',headers:{...H(),Prefer:'return=representation'},body:JSON.stringify({title,text,author:$('author').value.trim()||'Shaina',category:$('cat').value})});
  const j=await r.json();
  if(!r.ok){say(j.message||'Save failed (session expired? log in again)',1);return}
  say('Saved as poem #'+String(j[0].number).padStart(3,'0')+' ✓');
  $('title').value=$('text').value='';touched=false;suggest();load();
};
async function load(){
  const r=await fetch(SUPABASE_URL+'/rest/v1/poems_db?select=number,title&order=number.desc',{headers:H()});
  if(r.status===401){sessionStorage.removeItem('tok');token=null;show();return}
  const rows=await r.json();$('list').replaceChildren();
  rows.forEach(p=>{const d=document.createElement('div');d.className='row';
    const s=document.createElement('span');s.textContent=String(p.number).padStart(3,'0')+' · '+p.title;
    const b=document.createElement('button');b.className='s';b.textContent='Delete';
    b.onclick=async()=>{if(!confirm('Delete "'+p.title+'"?'))return;await fetch(SUPABASE_URL+'/rest/v1/poems_db?number=eq.'+p.number,{method:'DELETE',headers:H()});load()};
    d.append(s,b);$('list').append(d)});
}
$('imp').onclick=async()=>{
  const f=$('file').files[0];if(!f){alert('Choose poems.json first');return}
  const rows=JSON.parse(await f.text());
  for(let i=0;i<rows.length;i+=25){
    const r=await fetch(SUPABASE_URL+'/rest/v1/poems_db?on_conflict=number',{method:'POST',headers:{...H(),Prefer:'resolution=ignore-duplicates'},body:JSON.stringify(rows.slice(i,i+25))});
    if(!r.ok){$('impmsg').textContent='Failed at '+i+': '+((await r.json()).message||r.status);return}
    $('impmsg').textContent='Imported '+Math.min(i+25,rows.length)+' / '+rows.length;
  }
  load();
};
suggest();show();
</script></body></html>
